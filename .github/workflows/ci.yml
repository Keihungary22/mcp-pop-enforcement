name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q --ignore=tests/security

  go:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Go format check
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  docker:
    name: Docker / security E2E
    runs-on: ubuntu-latest
    needs:
      - python
      - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Configure Keycloak hostname resolution
        run: |
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          getent hosts host.docker.internal

      - name: Build Docker services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/compose.ci.yml \
            build

      - name: Start security test stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/compose.ci.yml \
            up -d

      - name: Wait for security stack
        run: python -m pytest tests/security/test_smoke.py -q

      - name: Security baseline tests
        run: python -m pytest tests/security/test_baseline.py -q

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/compose.ci.yml \
            logs --no-color

      - name: Stop security test stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/compose.ci.yml \
            down --remove-orphans