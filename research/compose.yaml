name: mcp-pop-research

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://host.docker.internal:8180"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"

  research-mcp:
    build:
      context: ..
      dockerfile: research/Dockerfile
    environment:
      RESEARCH_MCP_SOCKET: "/run/mcp/backend.sock"
    volumes:
      - research-mcp-socket:/run/mcp

  pop-enforcement:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":9200"
      UPSTREAM_MCP_URL: "http://research-mcp:9000/mcp"
      UPSTREAM_MCP_SOCKET: "/run/mcp/backend.sock"
      ACCESS_TOKEN_JWKS_URL: "http://host.docker.internal:8180/realms/mcp-pop/protocol/openid-connect/certs"
      ACCESS_TOKEN_INTROSPECTION_URL: "http://host.docker.internal:8180/realms/mcp-pop/protocol/openid-connect/token/introspect"
      INTROSPECTION_CLIENT_ID: "mcp-resource"
      INTROSPECTION_CLIENT_SECRET: "mcp-resource-secret"
      EXPECTED_ISSUER: "http://host.docker.internal:8180/realms/mcp-pop"
      EXPECTED_AUDIENCE: "mcp-resource"
      REQUIRED_SCOPE: "mcp:invoke"
      EXPECTED_DPOP_HTU: "http://127.0.0.1:9200/mcp"
    ports:
      - "9200:9200"
    volumes:
      - research-mcp-socket:/run/mcp
    group_add:
      - "101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - research-mcp

volumes:
  research-mcp-socket:
